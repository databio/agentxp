[project]
name = "agentxp"
version = "0.1.2"
description = "Measure how well AI chatbots do real tasks through a tool surface (MCP server today)."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [{ name = "Nathan Sheffield" }]
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/databio/agentxp"
Issues = "https://github.com/databio/agentxp/issues"

[project.scripts]
agentxp = "agentxp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentxp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
